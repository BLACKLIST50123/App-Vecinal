name: Compilar IPA para iPhone (Sideload / AltStore)

on:
  workflow_dispatch: # Permite ejecutar manualmente si está en la rama principal
  push:
    branches:
      - '**' # Se dispara automáticamente al hacer push en CUALQUIER rama (incluida tu rama actual)
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Compilar IPA de iOS
    runs-on: macos-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Inyectar credenciales supabase.json
        env:
          SUPABASE_JSON_SECRET: ${{ secrets.SUPABASE_JSON }}
        run: |
          if [ -n "$SUPABASE_JSON_SECRET" ]; then
            echo "$SUPABASE_JSON_SECRET" > supabase.json
            echo "supabase.json configurado desde secretos de GitHub."
          else
            echo "Generando supabase.json con valores base del proyecto..."
            cat << 'EOF' > supabase.json
{
    "SUPABASE_URL": "https://valxntyeowpuxvlcpqfk.supabase.co",
    "SUPABASE_ANON_KEY": "sb_publishable_IgR6AwX5-HC6gudGEAsCVA_-uUmYVRC",
    "FIREBASE_API_KEY": "AIzaSyDYU6vDOPCGgffTIIytVcjlMhPjdZKb27w",
    "FIREBASE_APP_ID": "1:935326892525:android:c2f427fe8f945b442667e4",
    "FIREBASE_SENDER_ID": "935326892525",
    "FIREBASE_PROJECT_ID": "conecta-vecino"
}
EOF
          fi

      - name: Obtener dependencias de Flutter
        run: flutter pub get

      - name: Instalar CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Compilar iOS Release (no-codesign)
        run: flutter build ios --release --no-codesign --dart-define-from-file=supabase.json

      - name: Empaquetar en archivo .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app-release.ipa Payload
          rm -rf Payload

      - name: Subir archivo IPA como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: Conecta-Vecino-iOS-IPA
          path: app-release.ipa
          retention-days: 7

